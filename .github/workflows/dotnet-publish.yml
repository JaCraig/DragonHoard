# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Publish

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: write

jobs:
  login:
    permissions:
      contents: write
      id-token: write
    env:
      BUILD_CONFIG: "Release"

    runs-on: ubuntu-latest
    steps:
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

  build:
    uses: "JaCraig/Centralized-Workflows/.github/workflows/dotnet-publish.yml@main"
    with:
      user: "JaCraig"
      user-email: "JaCraig@users.noreply.github.com"
      coveralls-upload: "./DragonHoard.InMemory.Tests/TestResults-10.0.x/coverage.net10.0.info"
      test-filter: "DragonHoard.InMemory.Tests"
    secrets:
      NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
